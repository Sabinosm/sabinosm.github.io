<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pagina.medicamentos.titulo">B-íon — Medicamentos</title>
<script src="../../../../js/sharedConfig/loaders/preferenciasLoader.js"></script>
<link rel="stylesheet" href="../../../../css/pages/user/shared/listaBusca.css">
<link rel="stylesheet" href="../../../../css/pages/comumCss.css">
<link rel="icon" type="image/svg+xml" href="../../../../assets/imgs/favicon.svg">
</head>
<body data-requer="atenderClinicamente" data-modulo="medicamentos">

<canvas id="c" aria-hidden="true"></canvas>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <header class="main-header">
      <div>
        <h1 data-i18n="medicamentos.titulo">Medicamentos</h1>
        <p class="main-subtitle" data-i18n="medicamentos.subtitulo">Busque por princípio ativo, nome comercial ou indicação</p>
      </div>
    </header>

    <section class="section">

      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" stroke-linecap="round"/>
              <path d="M21 21l-4.3-4.3" stroke-linecap="round"/>
            </svg>
            <input type="text" class="search-input" id="busca-medicamento" autocomplete="off"
                   placeholder="Buscar por princípio ativo ou nome comercial"
                   data-i18n-placeholder="medicamentos.busca_placeholder">
          </div>
          <button class="btn-filter" id="btn-toggle-filtros" type="button">
            <svg class="btn-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M7 12h10M10 18h4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="btn.filtros">Filtros</span>
          </button>
        </div>

        <div class="filter-panel" id="filter-panel">
          <div class="filter-field">
            <label for="filtro-classe" data-i18n="medicamentos.filtro_classe">Classe farmacêutica</label>
            <select id="filtro-classe">
              <option value="" data-i18n="medicamentos.filtro_todas">Todas</option>
            </select>
          </div>

          <div class="filter-field filter-field--largo">
            <label for="filtro-indicacao" data-i18n="medicamentos.filtro_indicacao">Indicado para</label>
            <input type="text" id="filtro-indicacao" list="sugestoes-indicacao" autocomplete="off"
                   placeholder="Ex.: dor de cabeça" data-i18n-placeholder="medicamentos.filtro_indicacao_ph">
            <datalist id="sugestoes-indicacao"></datalist>
          </div>

          <div class="filter-field filter-field--largo">
            <label for="filtro-sem-contra" data-i18n="medicamentos.filtro_sem_contra">Sem contraindicação em</label>
            <input type="text" id="filtro-sem-contra" list="sugestoes-contra" autocomplete="off"
                   placeholder="Ex.: gravidez" data-i18n-placeholder="medicamentos.filtro_sem_contra_ph">
            <datalist id="sugestoes-contra"></datalist>
            <div class="chip-list" id="chips-sem-contra"></div>
          </div>

          <div class="filter-panel-actions">
            <button class="btn-ghost" id="btn-limpar-filtros" type="button" data-i18n="btn.limpar">Limpar</button>
          </div>
        </div>
      </div>

      <div class="card-list" id="lista-medicamentos">
        <!-- Preenchido dinamicamente por medicamentos.js -->
      </div>

      <div class="pagination" id="paginacao">
        <!-- Preenchido dinamicamente por medicamentos.js -->
      </div>

    </section>

  </main>
</div>

<!-- Modal de Configurações e sidebar injetados pelos loaders (ver initPagina.js) -->
<script src="../../../../js/shared/particles.js"></script>
<script type="module" src="../../../../js/pages/user/shared/medicamentos/medicamentos.js"></script>
</body>
</html>
