<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-íon — Gerenciamento</title>
<script src="../../../../js/sharedConfig/themeLoader.js"></script>
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminHomePage.css">
<link rel="stylesheet" href="../../../../css/pages/user/settings.css">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <header class="main-header">
      <div>
        <h1>Gerenciamento</h1>
        <p class="main-subtitle">Visão geral da instituição</p>
      </div>
      
    </header>

    <!-- Métricas — visão institucional -->
    <section class="metrics">
      <div class="metric-card">
        <div class="metric-value" id="metric-profissionais-ativos">—</div>
        <div class="metric-label">Profissionais ativos</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metric-pacientes-cadastrados">—</div>
        <div class="metric-label">Pacientes cadastrados</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metric-consultas-hoje">—</div>
        <div class="metric-label">Consultas hoje</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metric-convites-pendentes">—</div>
        <div class="metric-label metric-label--accent status--aguardando-medico">Convites pendentes</div>
      </div>
    </section>

    <h2 class="section-title">Desempenho e IA</h2>
    <section class="metrics">
      <div class="metric-card">
        <div class="metric-value" id="metric-taxa-conclusao">—</div>
        <div class="metric-label">Taxa de conclusão (30d)</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metric-confianca-ia">—</div>
        <div class="metric-label">Confiança média da IA (30d)</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metric-versao-ia">—</div>
        <div class="metric-label" id="metric-versao-ia-label">Versão de IA predominante</div>
      </div>
      <div class="metric-card">
        <div class="metric-value" id="metric-efetivo-detalhe">—</div>
        <div class="metric-label" id="metric-efetivo-detalhe-label">Efetivo por papel</div>
      </div>
    </section>

  </main>
</div>

<script type="module" src="../../../../js/sharedConfig/settingsLoader.js"></script>
<script type="module" src="../../../../js/sharedConfig/initHomePage.js"></script>
<script src="../../../../js/sharedConfig/sidebarLoader.js"></script>
</body>
</html>
