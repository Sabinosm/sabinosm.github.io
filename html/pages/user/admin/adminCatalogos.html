<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pagina.catalogos.titulo">B-íon — Catálogo de Protocolos</title>
<script src="../../../../js/sharedConfig/themeLoader.js"></script>
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminHomePage.css">
<link rel="stylesheet" href="../../../../css/pages/user/settings.css">
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminCatalogos.css">
<link rel="icon" type="image/svg+xml" href="../../../../assets/imgs/favicon.svg">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <header class="main-header">
      <div>
        <h1 data-i18n="catalogos.titulo">Catálogo de Protocolos</h1>
        <p class="main-subtitle" data-i18n="catalogos.subtitulo">Escores, árvores de triagem e PCDTs disponíveis para a instituição</p>
      </div>
    </header>

    <section class="section">

      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" stroke-linecap="round"/>
              <path d="M21 21l-4.3-4.3" stroke-linecap="round"/>
            </svg>
            <input type="text" class="search-input" id="busca-protocolo" placeholder="Buscar por nome ou sigla" data-i18n-placeholder="catalogos.busca_placeholder">
          </div>
          <button class="btn-filter" id="btn-toggle-filtros" type="button">
            <svg class="btn-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M7 12h10M10 18h4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="btn.filtros">Filtros</span>
          </button>
        </div>

        <!-- Painel de filtros — espelha os query params reais do back:
             ?tipo_protocolo=&escopo_populacao=&escopo_uso=&apenas_liberados= -->
        <div class="filter-panel" id="filter-panel">
          <div class="filter-field">
            <label for="filtro-tipo-protocolo" data-i18n="catalogos.tipo_protocolo">Tipo de protocolo</label>
            <select id="filtro-tipo-protocolo">
              <option value="" data-i18n="filtro.todos">Todos</option>
              <option value="escore-ponderado" data-i18n="catalogos.tipo.escore_ponderado">Escore ponderado</option>
              <option value="arvore-decisao" data-i18n="catalogos.tipo.arvore_decisao">Árvore de decisão</option>
              <option value="regra-categorica" data-i18n="catalogos.tipo.regra_categorica">Regra categórica</option>
              <option value="protocolo-composto" data-i18n="catalogos.tipo.composicao_modulos">Composição de módulos</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="filtro-escopo-populacao" data-i18n="catalogos.populacao">População</label>
            <select id="filtro-escopo-populacao">
              <option value="" data-i18n="filtro.todas">Todas</option>
              <option value="adulto" data-i18n="catalogos.populacao.adulto">Adulto</option>
              <option value="pediatrico" data-i18n="catalogos.populacao.pediatrico">Pediátrico</option>
              <option value="obstetrico" data-i18n="catalogos.populacao.obstetrico">Obstétrico</option>
              <option value="neonatal" data-i18n="catalogos.populacao.neonatal">Neonatal</option>
              <option value="universal" data-i18n="catalogos.populacao.universal">Universal</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="filtro-escopo-uso" data-i18n="catalogos.uso">Uso</label>
            <select id="filtro-escopo-uso">
              <option value="" data-i18n="filtro.todos">Todos</option>
              <option value="triagem" data-i18n="catalogos.uso.triagem">Triagem</option>
              <option value="consulta" data-i18n="catalogos.uso.consulta">Consulta</option>
              <option value="ambos" data-i18n="catalogos.uso.ambos">Triagem e consulta</option>
            </select>
          </div>
          <div class="filter-field filter-field--checkbox">
            <input type="checkbox" id="filtro-apenas-liberados">
            <label for="filtro-apenas-liberados" data-i18n="catalogos.somente_liberados">Somente liberados pela instituição</label>
          </div>
          <div class="filter-panel-actions">
            <button class="btn-ghost" id="btn-limpar-filtros" type="button" data-i18n="btn.limpar">Limpar</button>
          </div>
        </div>
      </div>

      <div class="catalog-list" id="lista-protocolos">
        <!-- Preenchido dinamicamente por adminCatalogosLista.js -->
      </div>

      <div class="pagination" id="paginacao">
        <!-- Preenchido dinamicamente por adminCatalogosLista.js -->
      </div>

    </section>

  </main>
</div>

<!-- Modal de Configurações injetado dinamicamente por settingsLoader.js
     (partial compartilhado: html/partials/settingsModal.html) -->

<script type="module" src="../../../../js/sharedConfig/settingsLoader.js"></script>
<script type="module" src="../../../../js/pages/user/admin/adminCatalogos/adminCatalogosLista.js"></script>
<script type="module" src="../../../../js/sharedConfig/initHomePage.js"></script>
<script src="../../../../js/sharedConfig/sidebarLoader.js"></script>
</body>
</html>
