<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-íon — Detalhe do Protocolo</title>
<script src="../../../../js/sharedConfig/themeLoader.js"></script>
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminHomePage.css">
<link rel="stylesheet" href="../../../../css/pages/user/settings.css">
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminCatalogos.css">
<link rel="icon" type="image/svg+xml" href="../../../../assets/imgs/favicon.svg">
<!-- Sem <base target="_blank">: aqui os links (voltar) abrem na mesma aba. -->
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <a class="detalhe-voltar" id="btn-voltar" href="adminCatalogos.html">← Voltar ao catálogo</a>

    <!-- Carregando / erro -->
    <p class="detalhe-estado" id="detalhe-estado">Carregando protocolo…</p>

    <div class="detalhe-conteudo" id="detalhe-conteudo" hidden>

      <!-- Sigla - nome, versão no canto, escopo/uso/estado nos badges -->
      <header class="detalhe-cabecalho">
        <div class="detalhe-cabecalho-titulo">
          <span class="catalog-badge catalog-badge--sigla" id="detalhe-sigla"></span>
          <h1 class="detalhe-nome" id="detalhe-nome"></h1>
          <div class="detalhe-badges" id="detalhe-badges"></div>
        </div>
        <div class="detalhe-versao">
          <span class="detalhe-versao-numero" id="detalhe-versao-numero">—</span>
          <span id="detalhe-versao-vigencia"></span>
        </div>
      </header>

      <!-- Configuração: preenchida por adminCatalogosConfig.js.
           Pessoal: só médico/enfermeiro (o back manda favorito = null aos demais).
           Governança: só admin. Um médico-admin vê os dois. -->
      <section class="detalhe-bloco" id="config-pessoal" hidden>
        <h2 class="detalhe-secao-titulo">Minha configuração</h2>
        <div id="config-pessoal-corpo"></div>
      </section>

      <section class="detalhe-bloco" id="config-admin" hidden>
        <h2 class="detalhe-secao-titulo">Governança da instituição</h2>
        <div id="config-admin-corpo"></div>
      </section>

      <!-- Campos de entrada (via adaptador da família) -->
      <section id="secao-campos">
        <h2 class="detalhe-secao-titulo">Campos de entrada</h2>
        <div id="campos-corpo" class="detalhe-texto">Carregando campos…</div>
      </section>

      <!-- Só protocolos compostos -->
      <section id="secao-composicao" hidden>
        <h2 class="detalhe-secao-titulo">Composição</h2>
        <div id="composicao-corpo"></div>
      </section>

      <!-- Explicação -->
      <section id="secao-o-que-e" hidden>
        <h2 class="detalhe-secao-titulo">O que é</h2>
        <p class="detalhe-texto" id="detalhe-o-que-e"></p>
      </section>

      <section id="secao-quando-usar" hidden>
        <h2 class="detalhe-secao-titulo">Quando usar</h2>
        <p class="detalhe-texto" id="detalhe-quando-usar"></p>
      </section>

      <section id="secao-como-interpretar" hidden>
        <h2 class="detalhe-secao-titulo">Como interpretar</h2>
        <p class="detalhe-texto" id="detalhe-como-interpretar"></p>
      </section>

      <!-- Referência e metadados -->
      <section id="secao-referencia" hidden>
        <h2 class="detalhe-secao-titulo">Referência bibliográfica</h2>
        <p class="detalhe-texto" id="detalhe-referencia"></p>
      </section>

      <section>
        <h2 class="detalhe-secao-titulo">Informações do protocolo</h2>
        <dl class="detalhe-meta">
          <div class="detalhe-meta-item">
            <dt>Órgão emissor</dt>
            <dd id="detalhe-orgao">—</dd>
          </div>
          <div class="detalhe-meta-item">
            <dt>Em vigor desde</dt>
            <dd id="detalhe-vigencia">—</dd>
          </div>
          <div class="detalhe-meta-item" id="meta-vigencia-fim" hidden>
            <dt>Vigência até</dt>
            <dd id="detalhe-vigencia-fim">—</dd>
          </div>
        </dl>
      </section>

    </div>
  </main>
</div>

<!-- Modal de Configurações injetado dinamicamente por settingsLoader.js
     (partial compartilhado: html/partials/settingsModal.html) -->

<script type="module" src="../../../../js/sharedConfig/settingsLoader.js"></script>
<script type="module" src="../../../../js/pages/user/admin/adminCatalogos/adminCatalogosDetalhe.js"></script>
<script type="module" src="../../../../js/sharedConfig/initHomePage.js"></script>
<script src="../../../../js/sharedConfig/sidebarLoader.js"></script>
</body>
</html>
