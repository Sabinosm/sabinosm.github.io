<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>B-íon AI — Criar administrador</title>
<script src="../../../../js/sharedConfig/themeLoader.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../../../css/pages/user/admin/registration.css"/>
</head>
<body>

<canvas id="c"></canvas>

<div class="card">

  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="2.3" fill="#fff"/>
      <ellipse cx="14" cy="14" rx="11" ry="4.8" stroke="#fff" stroke-width=".8" opacity=".3" transform="rotate(-35 14 14)"/>
      <ellipse cx="14" cy="14" rx="11" ry="4.8" stroke="#fff" stroke-width=".8" opacity=".3" transform="rotate(85 14 14)"/>
      <circle cx="25" cy="14" r="1.4" fill="#fff" opacity=".6"/>
      <circle cx="6"  cy="11" r="1.4" fill="#fff" opacity=".6"/>
    </svg>
    <span class="logo-text">B-íon AI</span>
  </div>

  <!-- Passo 2 de 2 -- ver nota em empresaRegistration.html sobre por
       que isso não é um toggle de JS: são páginas distintas. -->
  <div class="page-steps" aria-hidden="true">
    <span class="page-step done"><span class="num">1</span> Empresa</span>
    <span class="step-connector"></span>
    <span class="page-step active"><span class="num">2</span> Administrador</span>
  </div>

  <h1>Criar administrador</h1>
  <p class="sub">Empresa cadastrada — agora configure a conta gestora</p>

  <form id="form-admin" method="post" action="#" novalidate>

    <div class="section-label">Dados pessoais</div>

    <div class="field">
      <label for="nome_completo">Nome completo</label>
      <input type="text" id="nome_completo" name="nome_completo" placeholder="Nome e sobrenome" autocomplete="name" maxlength="60" required/>
      <div class="error-msg" id="err-nome_completo"></div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required/>
        <div class="error-msg" id="err-cpf"></div>
      </div>
      <div class="field">
        <label for="telefone">Telefone <span style="opacity:.6">(opcional)</span></label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" autocomplete="tel"/>
        <div class="error-msg" id="err-telefone"></div>
      </div>
    </div>

    <div class="section-label">Acesso</div>

    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="nome@empresa.com" autocomplete="email" maxlength="50" required/>
      <div class="error-msg" id="err-email"></div>
    </div>

    <div class="field">
      <label for="user_login">Usuário de login</label>
      <input type="text" id="user_login" name="user_login" placeholder="usuario.login" autocomplete="username" minlength="3" maxlength="20" required/>
      <div class="hint">Usado para acessar o painel, pode ser diferente do e-mail</div>
      <div class="error-msg" id="err-user_login"></div>
    </div>

    <div class="row-2">
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Mínimo 12 caracteres" autocomplete="new-password" minlength="12" maxlength="128" required/>
        <div class="error-msg" id="err-senha"></div>
      </div>
      <div class="field">
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a senha" autocomplete="new-password" minlength="12" maxlength="128" required/>
        <div class="error-msg" id="err-confirmar_senha"></div>
      </div>
    </div>

    <div class="section-label">Função clínica <span style="opacity:.6">(opcional)</span></div>

    <div class="plan-options" id="funcao-clinica-options">
      <div class="plan-option">
        <input type="radio" id="funcao-nenhuma" name="tipo_papel" value="" checked/>
        <label for="funcao-nenhuma">
          <div class="plan-name">Nenhuma</div>
          <div class="plan-desc">Só administra</div>
        </label>
      </div>
      <div class="plan-option">
        <input type="radio" id="funcao-medico" name="tipo_papel" value="medico"/>
        <label for="funcao-medico">
          <div class="plan-name">Médico</div>
          <div class="plan-desc">Também atende</div>
        </label>
      </div>
      <div class="plan-option">
        <input type="radio" id="funcao-enfermeiro" name="tipo_papel" value="enfermeiro"/>
        <label for="funcao-enfermeiro">
          <div class="plan-name">Enfermeiro</div>
          <div class="plan-desc">Também atende</div>
        </label>
      </div>
    </div>

    <!-- Campos condicionais -- escondidos via [hidden] e só exibidos
         (e só validados/enviados) quando o papel correspondente está
         selecionado. adminRegistration.js limpa valor+erro ao trocar
         de opção, para nunca mandar campo "indevido" pro backend
         (ver model_validator em schema_usuario.py). -->
    <div class="conditional-fields" id="campos-medico" hidden>
      <div class="row-2">
        <div class="field">
          <label for="numero_crm">CRM</label>
          <input type="text" id="numero_crm" name="numero_crm" placeholder="000000" inputmode="numeric" maxlength="10"/>
          <div class="error-msg" id="err-numero_crm"></div>
        </div>
        <div class="field">
          <label for="uf_crm">UF do CRM</label>
          <input type="text" id="uf_crm" name="uf_crm" placeholder="SP" maxlength="2"/>
          <div class="error-msg" id="err-uf_crm"></div>
        </div>
      </div>
      <div class="field">
        <label for="rqe">RQE <span style="opacity:.6">(opcional)</span></label>
        <input type="text" id="rqe" name="rqe" placeholder="00000" inputmode="numeric" maxlength="10"/>
      </div>
    </div>

    <div class="conditional-fields" id="campos-enfermeiro" hidden>
      <div class="row-2">
        <div class="field">
          <label for="numero_coren">COREN</label>
          <input type="text" id="numero_coren" name="numero_coren" placeholder="000000" inputmode="numeric" maxlength="10"/>
          <div class="error-msg" id="err-numero_coren"></div>
        </div>
        <div class="field">
          <label for="uf_coren">UF do COREN</label>
          <input type="text" id="uf_coren" name="uf_coren" placeholder="SP" maxlength="2"/>
          <div class="error-msg" id="err-uf_coren"></div>
        </div>
      </div>
      <div class="field">
        <label for="especialidade">Especialidade</label>
        <input type="text" id="especialidade" name="especialidade" placeholder="Ex: Enfermagem obstétrica" maxlength="100"/>
        <div class="error-msg" id="err-especialidade"></div>
      </div>
    </div>

    <!-- tipo_usuario saiu do model (ver schema_usuario.py) -- este admin
         é sempre is_admin=true, setado direto no payload JS, não aqui. -->

    <button type="submit" class="btn-primary">CRIAR ADMINISTRADOR</button>
  </form>

  <div id="mensagemFeedback" role="status" aria-live="polite"></div>

  <p class="footer">Já tem uma conta? <a href="../../auth/login.html">Entrar</a></p>
</div>

<script type="module" src="../../../../js/shared/particles.js"></script>
<script type="module" src="../../../../js/shared/feedback.js"></script>
<script type="module" src="../../../../js/pages/user/admin/adminRegistration.js"></script>
</body>
</html>
