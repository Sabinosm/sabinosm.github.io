<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-íon — Estatísticas</title>
<script src="../../../../js/sharedConfig/themeLoader.js"></script>
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminEstatisticas.css">
<link rel="stylesheet" href="../../../../css/pages/user/settings.css">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <header class="main-header">
      <div>
        <h1>Estatísticas</h1>
        <p class="main-subtitle">Desempenho, epidemiologia e uso do sistema</p>
      </div>
    </header>

    <!-- Índices compostos (categoria E) — resumo executivo, sempre no
         topo. Cards aqui são maiores/destacados; ficam prontos para
         breakdown expansível quando as rotas E1/E4 forem destravadas. -->
    <section class="section" aria-labelledby="titulo-resumo-executivo">
      <h2 class="section-title" id="titulo-resumo-executivo">Resumo executivo</h2>
      <div class="metrics metrics--destaque" id="grid-resumo-executivo">
        <!-- populado via JS: iniciarCardsCategoria('resumo-executivo') -->
      </div>
    </section>

    <!-- Abas por categoria -->
    <div class="stat-tabs" role="tablist" aria-label="Categorias de estatísticas">
      <button type="button" class="stat-tab stat-tab--active" role="tab" aria-selected="true" aria-controls="painel-atendimentos" id="aba-atendimentos" data-categoria="atendimentos">
        Atendimentos
      </button>
      <button type="button" class="stat-tab" role="tab" aria-selected="false" aria-controls="painel-ia" id="aba-ia" data-categoria="ia">
        Desempenho da IA
      </button>
      <button type="button" class="stat-tab" role="tab" aria-selected="false" aria-controls="painel-epidemiologico" id="aba-epidemiologico" data-categoria="epidemiologico">
        Panorama regional
      </button>
      <button type="button" class="stat-tab" role="tab" aria-selected="false" aria-controls="painel-medicamentos" id="aba-medicamentos" data-categoria="medicamentos">
        Medicamentos e alergias
      </button>
      <button type="button" class="stat-tab" role="tab" aria-selected="false" aria-controls="painel-pacientes" id="aba-pacientes" data-categoria="pacientes">
        Perfil de pacientes
      </button>
    </div>

    <!-- Painéis — só o ativo fica visível; carregamento é disparado
         ao entrar em foco (ver adminEstatisticas.js), nunca todos de
         uma vez, para não pesar a página. -->
    <section class="stat-panel stat-panel--active" role="tabpanel" id="painel-atendimentos" aria-labelledby="aba-atendimentos">
      <div class="metrics" id="grid-atendimentos"></div>
    </section>

    <section class="stat-panel" role="tabpanel" id="painel-ia" aria-labelledby="aba-ia" hidden>
      <div class="metrics" id="grid-ia"></div>
    </section>

    <section class="stat-panel" role="tabpanel" id="painel-epidemiologico" aria-labelledby="aba-epidemiologico" hidden>
      <div class="metrics" id="grid-epidemiologico"></div>
      <div class="chart-list" id="graficos-epidemiologico"></div>
    </section>

    <section class="stat-panel" role="tabpanel" id="painel-medicamentos" aria-labelledby="aba-medicamentos" hidden>
      <div class="metrics" id="grid-medicamentos"></div>
      <div class="chart-list" id="graficos-medicamentos"></div>
    </section>

    <section class="stat-panel" role="tabpanel" id="painel-pacientes" aria-labelledby="aba-pacientes" hidden>
      <div class="metrics" id="grid-pacientes"></div>
      <div class="chart-list" id="graficos-pacientes"></div>
    </section>

  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module" src="../../../../js/sharedConfig/settingsLoader.js"></script>
<script type="module" src="../../../../js/pages/user/estatisticas/initEstatisticasPage.js"></script>
<script src="../../../../../js/sharedConfig/sidebarLoader.js"></script>
</body>
</html>
