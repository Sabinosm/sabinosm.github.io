<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pagina.pacientes.titulo">B-íon — Pacientes</title>
<script src="../../../../js/sharedConfig/preferenciasLoader.js"></script>
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminHomePage.css">
<link rel="stylesheet" href="../../../../css/pages/user/settings.css">
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminProfissionais.css">
<link rel="stylesheet" href="../../../../css/pages/user/admin/adminPacientes.css">
<link rel="stylesheet" href="../../../../css/pages/user/stepup.css">
<link rel="icon" type="image/svg+xml" href="../../../../assets/imgs/favicon.svg">
</head>
<body>

<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <div id="sidebar-slot"></div>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <header class="main-header">
      <div>
        <h1 data-i18n="pacientes.titulo">Pacientes</h1>
        <p class="main-subtitle" data-i18n="pacientes.subtitulo">Todos os pacientes cadastrados na instituição</p>
      </div>
      <a href="adminPacientesCriacao.html" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span data-i18n="pacientes.novo">Novo paciente</span>
      </a>
    </header>

    <section class="section">

      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" stroke-linecap="round"/>
              <path d="M21 21l-4.3-4.3" stroke-linecap="round"/>
            </svg>
            <input type="text" class="search-input" id="busca-paciente" placeholder="Buscar por nome ou CPF" data-i18n-placeholder="pacientes.busca_placeholder">
          </div>
          <button class="btn-filter" id="btn-toggle-filtros" type="button">
            <svg class="btn-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M7 12h10M10 18h4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="btn.filtros">Filtros</span>
          </button>
        </div>

        <!-- Painel de filtros: status e sexo biológico vão pro servidor
             (únicos aceitos pela API hoje -- ver find_all_param no
             backend). "Quem cadastrou" fica como placeholder de UI:
             não existe filtro correspondente na API ainda. -->
        <div class="filter-panel" id="filter-panel">
          <div class="filter-field">
            <label for="filtro-status" data-i18n="campo.status">Status</label>
            <select id="filtro-status">
              <option value="" data-i18n="filtro.todos">Todos</option>
              <option value="ativo" data-i18n="status.ativo">Ativo</option>
              <option value="inativo" data-i18n="status.inativo">Inativo</option>
              <option value="obito" data-i18n="pacientes.filtro.obito">Óbito</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="filtro-sexo-biologico" data-i18n="pacientes.filtro.sexo_biologico">Sexo biológico</label>
            <select id="filtro-sexo-biologico">
              <option value="" data-i18n="filtro.todos">Todos</option>
              <option value="masculino" data-i18n="pacientes.filtro.masculino">Masculino</option>
              <option value="feminino" data-i18n="pacientes.filtro.feminino">Feminino</option>
            </select>
          </div>
          <!-- "Quem cadastrou": qualquer pessoa pode cadastrar um
               paciente, e não há filtro correspondente na API
               (find_all_param não aceita esse parâmetro) -- só o nome
               de quem cadastrou aparece no card. Fica como botão
               placeholder -- ver TODO em adminPacientesLista.js. -->
          <div class="filter-field filter-field--placeholder">
            <label for="btn-filtro-cadastrado-por" data-i18n="pacientes.filtro.quem_cadastrou">Quem cadastrou</label>
            <button class="btn-ghost" id="btn-filtro-cadastrado-por" type="button" data-i18n="pacientes.filtro.selecionar">Selecionar…</button>
          </div>
          <div class="filter-panel-actions">
            <button class="btn-ghost" id="btn-limpar-filtros" type="button" data-i18n="btn.limpar">Limpar</button>
          </div>
        </div>
      </div>

      <div class="card-list" id="lista-pacientes">
        <!-- Preenchido dinamicamente por adminPacientesLista.js -->
      </div>

      <div class="pagination" id="paginacao">
        <!-- Preenchido dinamicamente por adminPacientesLista.js -->
      </div>

    </section>

  </main>
</div>


<script type="module" src="../../../../js/sharedConfig/settingsLoader.js"></script>
<script type="module" src="../../../../js/pages/user/admin/adminPacientes/adminPacientesLista.js"></script>
<script type="module" src="../../../../js/sharedConfig/initHomePage.js"></script>
<script src="../../../../js/sharedConfig/sidebarLoader.js"></script>
</body>
</html>
