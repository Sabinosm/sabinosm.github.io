  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main">

    <header class="main-header">
      <div>
        <h1>Pacientes</h1>
        <p class="main-subtitle">Todos os pacientes cadastrados na instituição</p>
      </div>
    </header>

    <section class="section">

      <div class="toolbar">
        <div class="toolbar-row">
          <div class="search-field">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" stroke-linecap="round"/>
              <path d="M21 21l-4.3-4.3" stroke-linecap="round"/>
            </svg>
            <input type="text" class="search-input" id="busca-paciente" placeholder="Buscar por nome ou CPF">
          </div>
          <button class="btn-filter" id="btn-toggle-filtros" type="button">
            <svg class="btn-filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M7 12h10M10 18h4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Filtros
          </button>
        </div>

        <!-- Painel de filtros: status e sexo biológico vão pro servidor
             (únicos aceitos pela API hoje -- ver find_all_param no
             backend). "Quem cadastrou" fica como placeholder de UI:
             não existe filtro correspondente na API ainda. -->
        <div class="filter-panel" id="filter-panel">
          <div class="filter-field">
            <label for="filtro-status">Status</label>
            <select id="filtro-status">
              <option value="">Todos</option>
              <option value="ativo">Ativo</option>
              <option value="inativo">Inativo</option>
              <option value="obito">Óbito</option>
            </select>
          </div>
          <div class="filter-field">
            <label for="filtro-sexo-biologico">Sexo biológico</label>
            <select id="filtro-sexo-biologico">
              <option value="">Todos</option>
              <option value="masculino">Masculino</option>
              <option value="feminino">Feminino</option>
            </select>
          </div>
          <!-- "Quem cadastrou": qualquer pessoa pode cadastrar um
               paciente, e não há filtro correspondente na API
               (find_all_param não aceita esse parâmetro) -- só o nome
               de quem cadastrou aparece no card. Fica como botão
               placeholder -- ver TODO em adminPacientesLista.js. -->
          <div class="filter-field filter-field--placeholder">
            <label for="btn-filtro-cadastrado-por">Quem cadastrou</label>
            <button class="btn-ghost" id="btn-filtro-cadastrado-por" type="button">Selecionar…</button>
          </div>
          <div class="filter-panel-actions">
            <button class="btn-ghost" id="btn-limpar-filtros" type="button">Limpar</button>
          </div>
        </div>
      </div>

      <div class="card-list" id="lista-pacientes">
        <!-- Preenchido dinamicamente por adminPacientesLista.js -->
      </div>

      <div class="pagination" id="paginacao">
        <!-- Preenchido dinamicamente por adminPacientesLista.js -->
      </div>

    </section>

  </main>
