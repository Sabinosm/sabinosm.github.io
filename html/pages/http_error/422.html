<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>422 — Dados inválidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

      <span class="dot"></span>

      <span class="card__bar-label">bion://error</span>

      <span class="status-badge">DadosInvalidosError</span>

      <a class="btn btn--primary" href="javascript:history.back()">Corrigir e tentar de novo</a>
      <a class="btn btn--ghost" href="../home/index.html">Voltar para o início</a>

    <div class="divider"></div>
    <div class="meta">
      <span>status_code: 422</span>
      <a href="/suporte">precisa de ajuda?</a>
