<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>401 — Erro de autenticação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../../../assets/imgs/favicon.svg">
<style>
:root {
  --black-0: #050505;
  --black-1: #121214;
  --gray-1: #1c1c1f;
  --gray-2: #2a2a2e;
  --gray-3: #3d3d42;
  --gray-4: #6b6b70;
  --gray-5: #9a9aa0;
  --white: #f0f0ee;
  --btn-hover: #d8d8d6;
  --card-shadow: rgba(0, 0, 0, 0.7);
  --glow: rgba(255, 255, 255, 0.04);
  --particle-line: 200, 200, 200;
  --particle-dot: 200, 200, 200;
  --font-mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html, body {
  height: 100%;
}
body {
  background: var(--black-0);
  color: var(--white);
  font-family: var(--font-sans);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
canvas#c {
  position: fixed;
  inset: 0;
  z-index: 0;
}
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--gray-1) 1px, transparent 1px),
    linear-gradient(90deg, var(--gray-1) 1px, transparent 1px);
  background-size: 48px 48px;
  opacity: 0.35;
  mask-image: radial-gradient(circle at center, black 0%, transparent 75%);
  pointer-events: none;
}
body::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 640px;
  height: 640px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
  pointer-events: none;
}
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  background: var(--black-1);
  border: 1px solid var(--gray-2);
  border-radius: 14px;
  padding: 40px 36px 32px;
  box-shadow: 0 24px 60px -20px var(--card-shadow);
}
.card__bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 28px;
}
.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--gray-3);
}
.card__bar-label {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--gray-4);
  text-transform: uppercase;
}
.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--gray-5);
  margin-bottom: 18px;
}
.status-line__cursor {
  display: inline-block;
  width: 7px;
  height: 14px;
  background: var(--gray-5);
  animation: blink 1.1s steps(1) infinite;
}
.status-line .status-badge {
  color: var(--white);
  border: 1px solid var(--gray-3);
  border-radius: 4px;
  padding: 1px 6px;
  font-weight: 600;
}
@keyframes blink {
  50% { opacity: 0; }
}
.code {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 92px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--white);
  margin-bottom: 6px;
}
.code__accent {
  color: var(--gray-4);
}
h1 {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--white);
}
p.description {
  font-size: 14px;
  line-height: 1.6;
  color: var(--gray-5);
  margin-bottom: 28px;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.btn {
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 600;
  padding: 11px 18px;
  border-radius: 8px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  cursor: pointer;
  border: 1px solid transparent;
}
.btn:active {
  transform: scale(0.98);
}
.btn--primary {
  background: var(--white);
  color: var(--black-0);
}
.btn--primary:hover {
  background: var(--btn-hover);
}
.btn--ghost {
  background: transparent;
  border-color: var(--gray-3);
  color: var(--gray-5);
}
.btn--ghost:hover {
  border-color: var(--gray-4);
  color: var(--white);
}
.divider {
  height: 1px;
  background: var(--gray-2);
  margin: 20px 0 16px;
}
.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gray-3);
}
.meta a {
  color: var(--gray-4);
  text-decoration: none;
}
.meta a:hover {
  color: var(--gray-5);
}
@media (max-width: 480px) {
  .code {
    font-size: 72px;
  }
  .card {
    padding: 32px 24px 26px;
  }
}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <main class="card">
    <div class="card__bar">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="card__bar-label">bion://error</span>
    </div>

    <div class="status-line">
      <span class="status-badge">AutenticacaoError</span>
      <span>lançada</span>
      <span class="status-line__cursor"></span>
    </div>

    <div class="code">401<span class="code__accent">.</span></div>
    <h1>Você precisa entrar para continuar</h1>
    <p class="description">
      Sua sessão expirou ou você ainda não fez login. Entre novamente com suas credenciais para acessar este recurso.
    </p>

    <div class="actions">
      <a class="btn btn--primary" href="../auth/login.html">Fazer login</a>
      <a class="btn btn--ghost" href="../home/index.html">Voltar para o início</a>
    </div>

    <div class="divider"></div>
    <div class="meta">
      <span>status_code: 401</span>
      <a href="/suporte">precisa de ajuda?</a>
    </div>
  </main>

  <script type="module" src="../../../js/shared/particles.js"></script>
</body>
</html>
