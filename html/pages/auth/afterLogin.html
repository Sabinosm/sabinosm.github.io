<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirmando login — Bion</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../css/pages/auth/auth.css"/>
  <link rel="icon" type="image/svg+xml" href="../../../assets/imgs/favicon.svg">
</head>
<body>

<canvas id="c"></canvas>

<div class="card">

  <div class="logo">
    <img src="../../../assets/imgs/logo.svg" alt="" id="logo-bion-svg">
    <span class="logo-text">B-íon</span>
  </div>

    <div class="loading-wrap">
    <div class="spinner" aria-hidden="true"></div>
    <p class="hint">Confirmando seu acesso...</p>
  </div>

  <button id="btn-tentar-novamente" class="btn-primary" type="button" hidden>Tentar novamente</button>

  <!-- Escolha de método -- só aparece quando o usuário tem mais de um
       método de 2FA disponível (ver /auth/status, metodos_disponiveis).
       Mesma classe .btn-2fa-opcao usada em onboarding.html. -->
  <div id="escolha-mfa-metodo" hidden>
    <p class="sub">Escolha como deseja confirmar sua identidade</p>
    <button class="btn-2fa-opcao" type="button" id="btn-mfa-escolher-webauthn">
      <strong>Chave de segurança (WebAuthn)</strong>
      <span class="sub">Passkey, chave física USB, ou biometria do dispositivo.</span>
    </button>
    <button class="btn-2fa-opcao" type="button" id="btn-mfa-escolher-totp">
      <strong>Aplicativo autenticador (TOTP)</strong>
      <span class="sub">Código de 6 dígitos do seu app autenticador.</span>
    </button>
  </div>

  <div id="mensagemFeedback" role="status" aria-live="polite"></div>

</div>

<script type="module" src="../../../js/shared/particles.js"></script>
<script type="module" src="../../../js/shared/feedback.js"></script>
<script type="module" src="../../../js/pages/auth/afterLogin.js"></script>
</body>
</html>
