<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeutronAI — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../../../css/pages/auth/auth.css"/>
</head>
<body>

<canvas id="c"></canvas>

<div class="card">

  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="14" cy="14" r="2.3" fill="#fff"/>
      <ellipse cx="14" cy="14" rx="11" ry="4.8" stroke="#fff" stroke-width=".8" opacity=".3" transform="rotate(-35 14 14)"/>
      <ellipse cx="14" cy="14" rx="11" ry="4.8" stroke="#fff" stroke-width=".8" opacity=".3" transform="rotate(85 14 14)"/>
      <circle cx="25" cy="14" r="1.4" fill="#fff" opacity=".6"/>
      <circle cx="6"  cy="11" r="1.4" fill="#fff" opacity=".6"/>
    </svg>
    <span class="logo-text">B-íon AI</span>
  </div>

  <h1>Entre na sua conta</h1>
  <p class="sub">+30M usuários confiam na plataforma</p>

  <button class="btn-google" type="button">
    <svg width="15" height="15" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908C16.658 14.013 17.64 11.705 17.64 9.2z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
      <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Continuar com Google
  </button>

  <form id="login-form" method="POST">
    <div class="divider">OU</div>

    <div class="field">
      <input name="user_login" placeholder="Usuário" autocomplete="username"/>
    </div>
    <div class="field">
      <input name="senha" type="password" placeholder="Senha" autocomplete="current-password"/>
    </div>

    <div class="forgot"><a href="#">Esqueceu a senha?</a></div>

    <button class="btn-primary" type="submit">ENTRAR</button>
    <p class="footer">Não tem uma conta? <a href="../enterprise/enterpriseRegistration.html">Cadastre-se</a></p>
  </form>

  <div id="mensagemFeedback"></div>

</div>

<script type="module" src="../../../js/shared/particles.js"></script>
<script type="module" src="../../../js/shared/feedback.js"></script>
<script type="module" src="../../../js/pages/auth/login.js"></script>
</body>
</html>
